<style>
/* Estilos base orientados a la experiencia horizontal / apaisada */
body { background-color: #111827; color: #f3f4f6; font-family: system-ui, sans-serif; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
.container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 12px; }
.header { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
h1 { font-size: 1.15rem; margin: 0; }
.seccion-titulo { font-size: 1rem; font-weight: bold; color: #34d399; border-bottom: 2px solid #374151; padding-bottom: 2px; margin-bottom: 6px; }

/* Grilla principal horizontal de opciones */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.btn { background-color: #1f2937; color: #f3f4f6; border: 1px solid #374151; padding: 10px; border-radius: 10px; text-align: left; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:active { background-color: #374151; }
.hidden { display: none !important; }

/* Botón de retroceso */
.btn-volver { background-color: #1f2937; color: white; border: 1px solid #374151; padding: 4px 10px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 6px; }
.btn-volver:active { background-color: #374151; }
.logo-volver { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

/* Ítems de selección */
.item { background-color: #1f2937; padding: 10px 12px; border-radius: 10px; border: 1px solid #374151; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.item:active { background-color: #374151; }
.item-animo { background-color: #1f2937; padding: 10px 12px; border-radius: 10px; border: 1px solid #374151; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.item-animo:active { background-color: #374151; }
.animo-titulo { font-weight: 600; font-size: 14px; color: #f3f4f6; }
.animo-desc { font-size: 11px; color: #9ca3af; }

/* Pantalla 4: Consejos y Sponsor (Diseño apaisado en dos columnas) */
.consejos-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px; align-items: stretch; }
.consejos-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.sponsor-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.sponsor-img { width: 60px; height: 60px; object-fit: contain; background-color: #111827; border-radius: 8px; padding: 4px; }

/* Pantalla 5: Gran Final (Foto gigante del plato humeante) */
.final-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.final-img { width: 100%; height: 240px; object-fit: cover; background-color: #374151; }
.final-info-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(17,24,39,0.95), transparent); padding: 16px 16px 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.final-titulo-plato { font-size: 1.25rem; font-weight: bold; color: white; margin: 0; }
.final-tag { font-size: 11px; color: #34d399; font-weight: bold; text-transform: uppercase; }
</style>
</head>
